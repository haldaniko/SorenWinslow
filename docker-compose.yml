services:
  env-setup:
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: ["node", "scripts/setup-env.mjs"]

  postgres:
    profiles: ["legacy-postgres"]
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - sorenwinslow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    env_file:
      - .env
    command: ["redis-server", "--requirepass", "$${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: sorenwinslow-backend-dev
    build:
      context: ./backend
      target: dev
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      SQLITE_PATH: /app/data/db.sqlite3
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CORS_ORIGIN: http://localhost:3000
      SITE_URL: http://localhost:3000
    volumes:
      - sorenwinslow_uploads:/app/uploads
      - sorenwinslow_sqlite_data:/app/data
    depends_on:
      env-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    image: sorenwinslow-frontend-dev
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      VITE_API_URL: http://localhost:4000
    depends_on:
      env-setup:
        condition: service_completed_successfully
      backend:
        condition: service_healthy

  admin-seed:
    image: sorenwinslow-backend-dev
    env_file:
      - .env
    environment:
      SQLITE_PATH: /app/data/db.sqlite3
    command: npm run create-superadmin
    volumes:
      - sorenwinslow_sqlite_data:/app/data
    depends_on:
      env-setup:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    restart: "no"

volumes:
  sorenwinslow_postgres_data:
  sorenwinslow_uploads:
  sorenwinslow_sqlite_data:
