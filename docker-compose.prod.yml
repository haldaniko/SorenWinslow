services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "default_transaction_read_only=on"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - sorenwinslow_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  migrate:
    image: sorenwinslow-backend-prod
    build:
      context: ./backend
      target: prod
    command: ["node", "scripts/migrate-production.mjs"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DATA_ROOT: /data
      SOURCE_UPLOAD_DIR: /source-uploads
    volumes:
      - ./:/data
      - sorenwinslow_prod_uploads:/source-uploads:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: sorenwinslow-backend-prod
    build:
      context: ./backend
      target: prod
    entrypoint: ["sh", "scripts/start-production.sh"]
    restart: unless-stopped
    ports:
      - "4103:4000"
    volumes:
      - ./:/data
    env_file:
      - path: backend/.env.production
        required: false
    environment:
      NODE_ENV: production
      SQLITE_PATH: /data/db.sqlite3
      UPLOAD_DIR: /data/media
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    image: sorenwinslow-frontend-prod
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID}
    restart: unless-stopped
    ports:
      - "8098:3000"
    environment:
      NODE_ENV: production
      VITE_API_URL: ${VITE_API_URL}
      VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID}
    depends_on:
      backend:
        condition: service_healthy

  admin-seed:
    profiles: ["admin-tools"]
    image: sorenwinslow-backend-prod
    env_file:
      - path: backend/.env.production
        required: false
    environment:
      NODE_ENV: production
      SQLITE_PATH: /data/db.sqlite3
      LOCAL_SUPERADMIN_EMAIL: ${LOCAL_SUPERADMIN_EMAIL:-}
      LOCAL_SUPERADMIN_PASSWORD: ${LOCAL_SUPERADMIN_PASSWORD:-}
    volumes:
      - ./:/data
    command: npm run create-superadmin
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  sorenwinslow_prod_postgres_data:
  sorenwinslow_prod_uploads:
