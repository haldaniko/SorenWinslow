services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "default_transaction_read_only=on"]
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - sorenwinslow_prod_postgres_data:/var/lib/postgresql/data
      - sorenwinslow_prod_postgres_socket:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-sorenwinslow}\" -d \"$${POSTGRES_DB:-sorenwinslow}\""]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - .env
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20

  migrate:
    image: sorenwinslow-backend-prod
    build:
      context: ./backend
      target: prod
    command: ["node", "scripts/migrate-production.mjs"]
    restart: "no"
    env_file:
      - .env
    environment:
      PGHOST: /var/run/postgresql
      PGPORT: 5432
      DATA_ROOT: /data
      SOURCE_UPLOAD_DIR: /source-uploads
    volumes:
      - ./:/data
      - sorenwinslow_prod_uploads:/source-uploads:ro
      - sorenwinslow_prod_postgres_socket:/var/run/postgresql
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: sorenwinslow-backend-prod
    build:
      context: ./backend
      target: prod
    entrypoint: ["node", "scripts/start-production.mjs"]
    restart: unless-stopped
    ports:
      - "4103:4000"
    volumes:
      - ./:/data
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SQLITE_PATH: /data/db.sqlite3
      UPLOAD_DIR: /data/media
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    image: sorenwinslow-frontend-prod
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    ports:
      - "8098:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy

  admin-seed:
    profiles: ["admin-tools"]
    image: sorenwinslow-backend-prod
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SQLITE_PATH: /data/db.sqlite3
    volumes:
      - ./:/data
    command: npm run create-superadmin
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  sorenwinslow_prod_postgres_data:
  sorenwinslow_prod_uploads:
  sorenwinslow_prod_postgres_socket:
